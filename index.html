<!DOCTYPE HTML>
<html>
    <head>
        <title>〜 muppets 〜</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            body {
                background-color: #1c1c1c;
                color: #f5f5f5;
            }

            input, select {
                box-sizing: border-box;
                width: 300px;
            }

            input, select {
                background-color: #2b2b2b;
                color: #f5f5f5;
                border: 1px solid #5d5d5d;
                transition: border-color 0.3s ease-in-out;
            }

            input:focus, select:focus {
                border-color: #0078d7;
                outline: none;
            }
        </style>
    </head>
    <body>
        <div id="content" style="display: none">
            <form id="form">
                <input id="codename" autocorrect="off" autocapitalize="off" spellcheck="false" type="text" placeholder="Device codename" />
                <br />
                <select id="branches">
                    <option>lineage-22.2</option>
                    <option>lineage-22.1</option>
                    <option>lineage-22.0</option>
                    <option>lineage-21.0</option>
                    <option>lineage-20.0</option>
                    <option>lineage-19.1</option>
                    <option>lineage-18.1</option>
                    <option>lineage-17.1</option>
                    <option>lineage-16.0</option>
                    <option>lineage-15.1</option>
                    <option>cm-14.1</option>
                    <option>cm-13.0</option>
                </select>
                <br />
                <input type="submit" value="Generate manifest" />
            </form>
            <pre id="output" style="white-space: pre-wrap" />
        </div>
        <script src="https://cdn.jsdelivr.net/npm/xml-formatter@3.3.2/dist/browser/xml-formatter-singleton.min.js"></script>
        <script>
            (async () => {
                let raw_gh = (name, branch, filename) =>
                    `https://raw.githubusercontent.com/${name}/${branch}/${filename}`
                let raw_gl = (name, branch, filename) =>
                    `https://gitlab.com/api/v4/projects/${encodeURIComponent(name)}/repository/files/${encodeURIComponent(filename)}/raw?ref=${branch}`

                let repos = await fetch(raw_gh('LineageOS/mirror', 'main', 'default.xml'))
                    .then(value => value.text())
                    .then(value => new window.DOMParser().parseFromString(value, 'text/xml'))
                    .then(value => Array.from(value.getElementsByTagName('project')))
                    .then(value => value.map(x => x.getAttribute('name')))

                let find_muppets_repos = async (name, codename, branch) => {
                    let fetch_deps = async (out, name) => {
                        let dependencies = await fetch(raw_gh(name, branch, '/lineage.dependencies'))
                            .then(value => value.text())
                            .then(value => JSON.parse(value))
                            .then(value => value.map(x => x['repository']))
                            .catch(error => [])

                        for (let dep of dependencies) {
                            out = await fetch_deps(out, `LineageOS/${dep}`)
                        }

                        return out.concat(dependencies)
                    }

                    let oem = name.split('_').slice(0, 3).join('_')
                    let dependencies = (await fetch_deps([], name))
                        .filter(x => x.startsWith('android_device_'))

                    let muppets_gh = await fetch(raw_gh('TheMuppets/manifests', 'mirror', 'default.xml'))
                        .then(value => value.text())
                        .then(value => new window.DOMParser().parseFromString(value, 'text/xml'))
                        .then(value => Array.from(value.getElementsByTagName('project')))
                        .then(value => Object.assign({}, ...value.map(x => ({
                            [x.getAttribute('name').substring('TheMuppets/'.length)]: {
                                name: x.getAttribute('name'),
                                path: x.getAttribute('name').substr('TheMuppets/proprietary_'.length).replaceAll('_', '/'),
                                remote: 'github',
                            }
                        }))))
                    let muppets_gl = await fetch(raw_gl('the-muppets/manifest', 'mirror', 'default.xml'))
                        .then(value => value.text())
                        .then(value => new window.DOMParser().parseFromString(value, 'text/xml'))
                        .then(value => Array.from(value.getElementsByTagName('project')))
                        .then(value => Object.assign({}, ...value.map(x => ({
                            [x.getAttribute('name').substring('The-Muppets/'.length)]: {
                                name: x.getAttribute('name').replace('The-Muppets', 'the-muppets'),
                                path: x.getAttribute('name').substr('The-Muppets/proprietary_'.length).replaceAll('_', '/'),
                                remote: 'gitlab',
                            }
                        }))))
                    let muppets_repos = await ([oem, name, ...dependencies]
                        .map(x => x.replace(/.*android_device_/, '').replaceAll('_', '/'))
                        .reduce(async (acc, x) => {
                            let project = undefined
                            let project_gh = Object.values(muppets_gh).find(project => project.path.endsWith(`/${x}`))
                            let project_gl = Object.values(muppets_gl).find(project => project.path.endsWith(`/${x}`))

                            let add = false

                            if (!add && project_gh !== undefined) {
                                project = project_gh
                                add = await fetch(raw_gh(project.name, branch, 'Android.mk'), { method: 'HEAD' })
                                    .then(value => value.status === 200)
                                add |= await fetch(raw_gh(project.name, branch, 'BoardConfigVendor.mk'), { method: 'HEAD' })
                                    .then(value => value.status === 200)
                                add |= await fetch(raw_gh(project.name, branch, `${codename}/Android.mk`), { method: 'HEAD' })
                                    .then(value => value.status === 200)
                                add |= await fetch(raw_gh(project.name, branch, `${codename}/BoardConfigVendor.mk`), { method: 'HEAD' })
                                    .then(value => value.status === 200)
                                add |= await fetch(raw_gh(project.name, branch, `${codename}/${codename}-vendor.mk`), { method: 'HEAD' })
                                    .then(value => value.status === 200)
                                for (let dependency of dependencies) {
                                    let folder = dependency.split(/android_device_.*?_/)[1]
                                    add |= await fetch(raw_gh(project.name, branch, `${folder}/Android.mk`), { method: 'HEAD' })
                                        .then(value => value.status === 200)
                                    add |= await fetch(raw_gh(project.name, branch, `${folder}/BoardConfigVendor.mk`), { method: 'HEAD' })
                                        .then(value => value.status === 200)
                                }
                            }

                            if (!add && project_gl !== undefined) {
                                project = project_gl
                                add = await fetch(raw_gl(project.name, branch, 'Android.mk'), { method: 'HEAD' })
                                    .then(value => value.status === 200)
                                add |= await fetch(raw_gl(project.name, branch, 'BoardConfigVendor.mk'), { method: 'HEAD' })
                                    .then(value => value.status === 200)
                                add |= await fetch(raw_gl(project.name, branch, `${codename}/Android.mk`), { method: 'HEAD' })
                                    .then(value => value.status === 200)
                                add |= await fetch(raw_gl(project.name, branch, `${codename}/BoardConfigVendor.mk`), { method: 'HEAD' })
                                    .then(value => value.status === 200)
                                add |= await fetch(raw_gl(project.name, branch, `${codename}/${codename}-vendor.mk`), { method: 'HEAD' })
                                    .then(value => value.status === 200)
                                for (let dependency of dependencies) {
                                    let folder = dependency.split(/android_device_.*?_/)[1]
                                    add |= await fetch(raw_gl(project.name, branch, `${folder}/Android.mk`), { method: 'HEAD' })
                                        .then(value => value.status === 200)
                                    add |= await fetch(raw_gl(project.name, branch, `${folder}/BoardConfigVendor.mk`), { method: 'HEAD' })
                                        .then(value => value.status === 200)
                                }
                            }

                            return add ? (await acc).concat(project) : acc
                        }, []))

                    return muppets_repos
                }

                document.getElementById('form').addEventListener('submit', async (event) => {
                    event.preventDefault()

                    let output = document.getElementById('output')
                    output.innerHTML = ''

                    let codename = document.getElementById('codename').value

                    if (codename.length === 0) {
                        alert('Device codename cannot be empty!')
                        return
                    }

                    let name = repos.find(x => x.match(`LineageOS/android_device_\\w+_${codename}$`))

                    if (name === undefined) {
                        alert('Device not found!')
                        return
                    }

                    let branch = document.getElementById('branches').value
                    let branch_short = /^lineage-2[01].0$/.test(branch) ? branch.substring(0, branch.length - 2) : branch
                    let muppets_repos = await find_muppets_repos(name, codename, branch_short)

                    if (muppets_repos.length === 0) {
                        muppets_repos = await fetch(raw_gh('TheMuppets/manifests', branch_short, 'muppets.xml'))
                            .then(value => value.text())
                            .then(value => new window.DOMParser().parseFromString(value, 'text/xml'))
                            .then(value => Array.from(value.getElementsByTagName('project')))
                            .then(value => value.filter(x => x.hasAttribute('groups')))
                            .then(value => value.filter(x => x.getAttribute('groups').split(',').includes(`muppets_${codename}`)))
                            .then(value => Object.assign({}, ...value.map(x => ({
                                [x.getAttribute('name').substring('TheMuppets/'.length)]: {
                                    name: x.getAttribute('name'),
                                    path: x.getAttribute('name').substr('TheMuppets/proprietary_'.length).replaceAll('_', '/'),
                                    remote: 'github',
                                }
                            }))))
                            .then(value => Object.values(value))
                    }

                    if (muppets_repos.length === 0) {
                        alert(`Failed to generate manifest (perhaps ${codename} is not supported on ${branch}?)`)
                        return
                    }

                    let has_firmware = await fetch(raw_gl('the-muppets/proprietary_vendor_firmware', branch_short, `${codename}/firmware.mk`), { method: 'HEAD' })
                        .then(value => value.status === 200)

                    if (has_firmware) {
                        muppets_repos.push({
                            name: 'the-muppets/proprietary_vendor_firmware',
                            path: 'vendor/firmware',
                            remote: 'gitlab'
                        })
                    }

                    let local_manifest = document.implementation.createDocument(null, 'manifest')
                    local_manifest.insertBefore(
                        local_manifest.createProcessingInstruction('xml', 'version="1.0" encoding="UTF-8"'),
                        local_manifest.firstChild
                    )

                    if (muppets_repos.some(x => x.remote === 'gitlab')) {
                        let remote = local_manifest.createElement('remote')
                        remote.setAttribute('fetch', 'https://gitlab.com')
                        remote.setAttribute('name', 'gitlab')

                        local_manifest.documentElement.appendChild(remote)
                    }

                    for (repo of muppets_repos) {
                        let project = local_manifest.createElement('project')
                        project.setAttribute('name', repo.name)
                        project.setAttribute('path', repo.path)
                        project.setAttribute('remote', repo.remote)

                        if (branch !== branch_short) {
                            project.setAttribute('revision', branch_short)
                        }

                        if (repo.path === 'vendor/firmware') {
                            project.setAttribute('clone-depth', 1)
                        }

                        local_manifest.documentElement.appendChild(project)
                    }

                    let prompt = `<div style="display: inline-block; user-select: none">user@host:~/${branch_short}$ </div>`

                    if (branch_short.startsWith("cm-")) {
                        output.innerHTML = `${prompt}cat .repo/local_manifests/muppets.xml\n`
                        output.innerHTML += xmlFormatter(new XMLSerializer().serializeToString(local_manifest))
                            .replace(/</g, '&lt;')
                            .replace(/>/g, '&gt;')
                        output.innerHTML += '\n'
                    } else {
                        for (project of local_manifest.getElementsByTagName("remote")) {
                            output.innerHTML += `${prompt}lineage/scripts/add-repo/add-repo.py add-remote \\\n`
                            output.innerHTML += `    --name ${project.getAttribute("name")} \\\n`
                            output.innerHTML += `    --fetch ${project.getAttribute("fetch")} \\\n`
                            output.innerHTML += '    --file .repo/local_manifests/muppets.xml\n'
                        }

                        for (project of local_manifest.getElementsByTagName("project")) {
                            output.innerHTML += `${prompt}lineage/scripts/add-repo/add-repo.py add-project \\\n`
                            output.innerHTML += `    --name ${project.getAttribute("name")} \\\n`
                            output.innerHTML += `    --path ${project.getAttribute("path")} \\\n`
                            output.innerHTML += `    --remote ${project.getAttribute("remote")} \\\n`
                            if (project.hasAttribute("revision")) {
                                output.innerHTML += `    --revision ${project.getAttribute("revision")} \\\n`
                            }
                            if (project.hasAttribute("clone-depth")) {
                                output.innerHTML += `    --clone-depth ${project.getAttribute("clone-depth")} \\\n`
                            }
                            output.innerHTML += '    --file .repo/local_manifests/muppets.xml\n'
                        }
                    }
                    output.innerHTML += `${prompt}rm -rf ${muppets_repos.map(x => x.path).join(' ')}`
                    output.innerHTML += `\n${prompt}repo sync ${muppets_repos.map(x => x.path).join(' ')}`
                })

                document.getElementById('content').removeAttribute('style')
                document.getElementById('codename').focus()
            })()
        </script>
    </body>
</html>
